[build]
  command = "npm run build:data && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # The API routes read public/data/pcode-compact.json via a dynamic fs path at
  # runtime, so the Next.js/Netlify bundler can't trace it automatically —
  # without this, every /api/* function throws "Dataset not found" in production.
  # scripts/build-data.ts generates both files from the CSVs in data/.
  included_files = ["public/data/pcode-compact.json", "public/data/pcode-meta.json"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    # Do not let the CDN cache these. The Next.js runtime emits its own
    # Netlify-Vary listing only __nextDataReq and _rsc, so the cache key leaves
    # out q, lat and lng: with s-maxage set, the first /api/search after a
    # deploy was served to every later query, and searching Mandalay returned
    # Yangon. A Netlify-Vary here does not help — the runtime's wins. Caching
    # can come back only when the key provably includes the query string.
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"

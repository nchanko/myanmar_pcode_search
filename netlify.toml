[build]
  command = "npm run build:data && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # The API routes read public/data/pcode-compact.json via a dynamic fs path at
  # runtime, so the Next.js/Netlify bundler can't trace it automatically —
  # without this, every /api/* function throws "Dataset not found" in production.
  # scripts/build-data.ts generates both files from the CSVs in data/.
  included_files = ["public/data/pcode-compact.json", "public/data/pcode-meta.json"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    # Default for any route that does not set its own Cache-Control. Routes
    # win over this file, so the real per-route decisions live in the handlers:
    # /search, /nearby and /geocode are no-store because Netlify's cache key
    # omits the query string, while /stats and /pcode/[code] stay cached since
    # their keys are path-only.
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"
